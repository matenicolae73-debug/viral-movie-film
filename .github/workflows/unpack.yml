name: Install ViralMovie AI V4

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        run: |
          set -e
          ZIP="./ViralMovie-AI-V4-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V4 ZIP not found:"
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"
          ls -lh "$ZIP"

      - name: Unzip V4
        run: |
          set -e
          rm -rf extracted
          mkdir extracted

          unzip -o "./ViralMovie-AI-V4-FIXED.zip" -d extracted

      - name: Copy project files
        run: |
          set -e

          find extracted -mindepth 1 -maxdepth 1 \
            ! -name ".github" \
            -exec cp -R {} . \;

          rm -rf extracted
          rm -f "./ViralMovie-AI-V4-FIXED.zip"

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install ViralMovie AI V4"
            git push
          fi

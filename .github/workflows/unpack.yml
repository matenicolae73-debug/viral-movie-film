name: ViralMovie AI - UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - "ViralMovie-AI-V4-FIXED(5)-renamed.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check ZIP
        run: |
          echo "Checking ZIP..."
          ls -lh
          test -f "ViralMovie-AI-V4-FIXED(5)-renamed.zip"

      - name: Unpack ViralMovie
        run: |
          set -e

          ZIP="ViralMovie-AI-V4-FIXED(5)-renamed.zip"

          rm -rf /tmp/viralmovie
          mkdir -p /tmp/viralmovie

          echo "Unpacking $ZIP ..."

          unzip -o "$ZIP" -d /tmp/viralmovie

          echo "ZIP content:"
          find /tmp/viralmovie -maxdepth 3 -type f | sort

      - name: Copy project to root
        run: |
          set -e

          if [ ! -f "/tmp/viralmovie/package.json" ]; then
            echo "package.json not at root. Searching..."

            PACKAGE=$(find /tmp/viralmovie -type f -name "package.json" | head -n 1)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE")
          else
            PROJECT_DIR="/tmp/viralmovie"
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          # Șterge proiectul vechi
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "ViralMovie-AI-V4-FIXED(5)-renamed.zip" \
            -exec rm -rf {} +

          # Copiază noul proiect
          cp -a "$PROJECT_DIR"/. .

          # Șterge ZIP-ul după instalare
          rm -f "ViralMovie-AI-V4-FIXED(5)-renamed.zip"

          echo "DONE!"
          echo "Root files:"
          ls -lah

          test -f package.json

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Unpack ViralMovie AI"
            git push
          fi

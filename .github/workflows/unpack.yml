name: Unpack project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nu există niciun ZIP în root."
            ls -la
            exit 1
          fi

          echo "ZIP găsit: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extras."

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            PACKAGE_FILE=$(find extracted -name package.json -type f | head -n 1)

            if [ -n "$PACKAGE_FILE" ]; then
              PROJECT_DIR=$(dirname "$PACKAGE_FILE")
            fi
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "Nu am găsit package.json."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proiect găsit în: $PROJECT_DIR"

      - name: Copy project to root
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          for FILE in "$PROJECT_DIR"/*; do
            NAME=$(basename "$FILE")

            if [ "$NAME" = ".git" ]; then
              continue
            fi

            if [ "$NAME" = "extracted" ]; then
              continue
            fi

            rm -rf "./$NAME"
            cp -R "$FILE" "./$NAME"
          done

          rm -rf extracted
          rm -f ./*.zip

          echo "Proiect copiat în root."

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack project automatically"

      - name: Push changes
        shell: bash
        run: |
          git push

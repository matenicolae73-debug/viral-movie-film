name: ViralMovie AI AUTO UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find and unpack ZIP
        shell: bash
        run: |
          set -e

          echo "ZIP-uri găsite:"
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ NU AM GĂSIT NICIUN ZIP"
            exit 1
          fi

          echo "✅ Folosesc:"
          echo "$ZIP"

          rm -rf /tmp/viralmovie
          mkdir -p /tmp/viralmovie

          unzip -o "$ZIP" -d /tmp/viralmovie

          PACKAGE=$(find /tmp/viralmovie -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "❌ package.json nu există în ZIP"
            find /tmp/viralmovie -maxdepth 4 -type f
            exit 1
          fi

          PROJECT=$(dirname "$PACKAGE")

          echo "✅ PROIECT:"
          echo "$PROJECT"

          # Curățăm root-ul, păstrăm GitHub Actions
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          # Punem proiectul la root
          cp -a "$PROJECT"/. .

          # Ștergem ZIP-ul folosit
          rm -f "$ZIP"

          echo "=============================="
          echo "✅ UNPACK FINALIZAT"
          echo "=============================="

          test -f package.json
          echo "✅ package.json OK"

      - name: Commit and Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nicio modificare."
          else
            git commit -m "Auto unpack ViralMovie AI"
            git push
          fi

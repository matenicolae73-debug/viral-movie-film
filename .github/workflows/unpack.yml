name: ViralMovie AI AUTO UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ViralMovie ZIP
        shell: bash
        run: |
          set -e

          ZIP="ViralMovie-AI-V4-FIXED(5)-renamed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "❌ ZIP-ul nu există: $ZIP"
            echo "ZIP-uri găsite:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "✅ Găsit: $ZIP"

          rm -rf _unpack
          mkdir -p _unpack

          unzip -o "$ZIP" -d _unpack

          echo "📦 ZIP dezarhivat."

          # Găsește automat package.json
          PACKAGE=$(find _unpack -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "❌ package.json nu a fost găsit."
            find _unpack -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "✅ Proiect găsit în:"
          echo "$PROJECT_ROOT"

          # Șterge vechiul proiect, păstrând GitHub Actions
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_unpack" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          # Copiază proiectul la root
          cp -a "$PROJECT_ROOT"/. .

          # Curățare
          rm -rf _unpack
          rm -f "$ZIP"

          echo ""
          echo "=============================="
          echo "✅ VIRALMOVIE AI UNPACKED"
          echo "=============================="
          echo ""

          test -f package.json
          echo "✅ package.json OK"

      - name: Commit and Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nu există modificări."
          else
            git commit -m "Auto unpack ViralMovie AI"
            git push
            echo "✅ Proiectul a fost instalat automat."
          fi

name: Unzip ViralMovie AI

on:
  push:
    paths:
      - "ViralMovie-AI-V2-60MIN.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ViralMovie AI
        run: |
          set -e

          ZIP="ViralMovie-AI-V2-60MIN.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP-ul nu exista: $ZIP"
            exit 1
          fi

          mkdir -p temp_unzip
          unzip -o "$ZIP" -d temp_unzip

          cp -R temp_unzip/. .
          rm -rf temp_unzip
          rm -f "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Install ViralMovie AI V2"

          git push

name: Unpack ViralMovie AI

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find ViralMovie ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP="./ViralMovie-AI-V4-FIXED(7)(1).zip"

          if [ ! -f "$ZIP" ]; then
            echo "Exact ZIP not found. Searching for ViralMovie-AI-V4 ZIP..."
            ZIP=$(find . -maxdepth 1 -type f -name 'ViralMovie-AI-V4-*.zip' | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: No ViralMovie AI V4 ZIP found."
            echo "Expected:"
            echo "ViralMovie-AI-V4-FIXED(7)(1).zip"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ViralMovie ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Install project files
        shell: bash
        run: |
          set -e

          if [ -f "extracted/package.json" ]; then
            cp -a extracted/. .
          else
            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -z "$ROOT" ] || [ ! -f "$ROOT/package.json" ]; then
              echo "ERROR: package.json was not found after extraction."
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi

            cp -a "$ROOT"/. .
          fi

          rm -rf extracted

          echo "Project installed successfully."
          ls -lah

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          rm -f "$ZIP"

      - name: Commit project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install ViralMovie AI V4"
            git push
          fi

name: ViralMovie AI - AUTO UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP-ul nu este in root."
            exit 1
          fi

          echo "ZIP gasit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.zip.outputs.ZIP }}"

          rm -rf .unpack-temp
          mkdir -p .unpack-temp

          unzip -o "$ZIP" -d .unpack-temp

          echo "ZIP extras."

      - name: Find project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=".unpack-temp"

          if [ ! -f "$ROOT/package.json" ]; then
            PKG="$(find "$ROOT" -type f -name package.json -print -quit)"

            if [ -z "$PKG" ]; then
              echo "ERROR: package.json nu a fost gasit."
              exit 1
            fi

            ROOT="$(dirname "$PKG")"
          fi

          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Install project in repository root
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.ROOT }}"
          ZIP="${{ steps.zip.outputs.ZIP }}"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".unpack-temp" \
            ! -name "$(basename "$ZIP")" \
            -exec rm -rf {} +

          rsync -a --exclude=".github/" "$ROOT"/ ./

          rm -rf .unpack-temp
          rm -f "$ZIP"

          if [ ! -f package.json ]; then
            echo "ERROR: package.json lipseste dupa unpack."
            exit 1
          fi

          echo "================================"
          echo "ViralMovie AI UNPACK OK"
          echo "package.json este in root"
          echo "================================"

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if

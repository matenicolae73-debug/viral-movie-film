name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: unpack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ViralMovie-AI-V4-FIXED(7)(1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "EROARE: Nu am găsit fișierul:"
            echo "$ZIP_FILE"
            echo ""
            echo "Fișierele din root sunt:"
            ls -la
            exit 1
          fi

          echo "ZIP găsit:"
          ls -lh "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "ViralMovie-AI-V4-FIXED(7)(1).zip" -d extracted

          echo "ZIP extras cu succes."

      - name: Find project folder
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            PACKAGE_FILE=$(find extracted -type f -name "package.json" -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "EROARE: Nu am găsit package.json în ZIP."
              find extracted -maxdepth 5 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          fi

          echo "Folder proiect: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project to repository root
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          for ITEM in "$PROJECT_DIR"/*; do
            NAME=$(basename "$ITEM")

            if [ "$NAME" = ".git" ]; then
              continue
            fi

            rm -rf "./$NAME"
            cp -R "$ITEM" "./$NAME"
          done

          rm -rf extracted
          rm -f "ViralMovie-AI-V4-FIXED(7)(1).zip"

          echo "Proiectul a fost copiat în root."

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack ViralMovie project"

      - name: Push changes
        shell: bash
        run: |
          set -e

          git push origin HEAD:${{ github.ref_name }}

name: Unpack ViralMovie AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ViralMovie ZIP
        run: |
          set -e

          ZIP_FILE="./ViralMovie-AI-V4-FIXED(7)(1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found!"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP_FILE"

      - name: Unpack ZIP
        run: |
          set -e

          ZIP_FILE="./ViralMovie-AI-V4-FIXED(7)(1).zip"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Copy project to repository root
        run: |
          set -e

          find extracted -mindepth 1 -maxdepth 1 ! -name ".github" -exec cp -R {} . \;

          rm -rf extracted
          rm -f "./ViralMovie-AI-V4-FIXED(7)(1).zip"

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack ViralMovie AI V4"
            git push
          fi

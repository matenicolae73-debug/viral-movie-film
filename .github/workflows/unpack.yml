name: ViralMovie AI - Unzip

on:
  push:
    paths:
      - "**.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "EROARE: Nu am gasit niciun fisier ZIP."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP gasit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unzip project
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP" -d extracted

          echo "Continut ZIP:"
          find extracted -maxdepth 3 -type f | sort

      - name: Install project files
        run: |
          set -e

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then

            FOLDER=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -R "$FOLDER"/. .

          else

            cp -R extracted/. .

          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nicio modificare."
          else
            git commit -m "Install ViralMovie AI"
            git push
          fi

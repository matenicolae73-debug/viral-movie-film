name: ViralMovie AI - AUTO UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP automatically
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ Niciun ZIP găsit în root."
            ls -lah
            exit 1
          fi

          echo "✅ ZIP găsit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.zip.outputs.ZIP }}"

          rm -rf _unpack
          mkdir -p _unpack

          echo "📦 Dezarhivez: $ZIP"

          unzip -o "$ZIP" -d _unpack

          echo "📂 Conținut extras:"
          find _unpack -maxdepth 3 -type f | head -100

      - name: Detect project root
        shell: bash
        run: |
          set -e

          ROOT="_unpack"

          # Dacă ZIP-ul conține un singur folder,
          # intrăm automat în acel folder.
          ITEMS=$(find "_unpack" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ]; then
            ONE=$(find "_unpack" -mindepth 1 -maxdepth 1 | head -n 1)

            if [ -d "$ONE" ]; then
              ROOT="$ONE"
            fi
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "✅ Project root: $ROOT"

          if [ ! -f "$ROOT/package.json" ]; then
            echo "⚠️ package.json nu a fost găsit direct."

            FOUND=$(find "$ROOT" -name package.json -type f | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "❌ package.json nu există în ZIP."
              exit 1
            fi

            ROOT=$(dirname "$FOUND")
            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

            echo "✅ package.json găsit în: $ROOT"
          fi

      - name: Install project files
        shell: bash
        run: |
          set -e

          echo "🚀 Instalez proiectul ViralMovie AI..."

          # Ștergem fișierele vechi ale proiectului,
          # dar păstrăm .git și workflow-ul.
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_unpack" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          # Copiem proiectul extras în root.
          cp -a "$PROJECT_ROOT"/. .

          rm -rf _unpack

          # Ștergem ZIP-ul după instalare.
          rm -f "${{ steps.zip.outputs.ZIP }}"

          echo ""
          echo "=============================="
          echo "✅ VIRALMOVIE AI INSTALAT"
          echo "=============================="
          echo ""

          echo "Root:"
          ls -lah

          echo ""
          echo "package.json:"
          test -f package.json
          ls -lh package.json

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nu există modificări."
          else
            git commit -m "AUTO INSTALL ViralMovie AI"
            git push
            echo "✅ Proiectul a fost trimis automat în GitHub."
          fi

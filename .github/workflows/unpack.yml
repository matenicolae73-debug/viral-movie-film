name: Unpack project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    name: unpack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Nu există niciun fișier ZIP în root-ul repository-ului."
            echo "Fișiere găsite:"
            ls -la
            exit 1
          fi

          echo "ZIP găsit: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extras cu succes."
          find extracted -maxdepth 3 -type f | head -100

      - name: Find project root
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            FOUND_PACKAGE="$(find extracted -type f -name package.json -print -quit)"

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_DIR="$(dirname "$FOUND_PACKAGE")"
            fi
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Nu am găsit package.json în ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install project in repository root
        shell:

name: Install ViralMovie AI V3

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V3 ZIP
        run: |
          set -e

          ZIP="./ViralMovie-AI-V3-Interactive.zip"

          if [ ! -f "$ZIP" ]; then
            echo "EROARE: ZIP-ul V3 nu exista:"
            ls -lah
            exit 1
          fi

          echo "ZIP GASIT:"
          ls -lh "$ZIP"

      - name: Unzip V3
        run: |
          set -e
          rm -rf extracted
          mkdir extracted

          unzip -o "./ViralMovie-AI-V3-Interactive.zip" -d extracted

          echo "FISIERE EXTRASE:"
          find extracted -maxdepth 4 -type f | sort

      - name: Copy project
        run: |
          set -e

          find extracted -mindepth 1 -maxdepth 1 \
            ! -name ".github" \
            -exec cp -R {} . \;

          rm -rf extracted
          rm -f "./ViralMovie-AI-V3-Interactive.zip"

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari."
          else
            git commit -m "Install ViralMovie AI V3"
            git push
          fi

name: Install ViralMovie AI V2

on:
  push:
    paths:
      - "*.zip"

jobs:
  install:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ViralMovie ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "ViralMovie-AI-V2-60MIN.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "EROARE: ViralMovie-AI-V2-60MIN.zip nu a fost gasit."
            echo "Fisierele din root sunt:"
            ls -la
            exit 1
          fi

          echo "GASIT: $ZIP"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf temp_movie
          mkdir temp_movie

          unzip -o "ViralMovie-AI-V2-60MIN.zip" -d temp_movie

          cp -R temp_movie/. .
          rm -rf temp_movie
          rm -f "ViralMovie-AI-V2-60MIN.zip"

      - name: Commit ViralMovie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari."
          else
            git commit -m "Install ViralMovie AI V2"
            git push
          fi

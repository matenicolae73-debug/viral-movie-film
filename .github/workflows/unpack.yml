name: Unpack ZIP to root

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Unpack ZIP
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          unzip -o "$ZIP_FILE" -d .

          rm -f "$ZIP_FILE"

      - name: Remove ZIP leftovers
        run: |
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack ViralMovie AI project"
            git push
          fi

name: Install ViralMovie AI V2

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find first ViralMovie ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -name "ViralMovie-AI-V2-60MIN.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "EROARE: ViralMovie-AI-V2-60MIN.zip NU a fost gasit."
            echo "Fisiere gasite:"
            ls -la
            exit 1
          fi

          echo "ZIP GASIT: $ZIP"

      - name: Unzip first ViralMovie ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "ViralMovie-AI-V2-60MIN.zip" -d extracted

          echo "ZIP DEZARHIVAT CU SUCCES."

      - name: Copy project files
        run: |
          set -e

          # Copiem proiectul, dar NU atingem .github/workflows
          # pentru a evita eroarea de permisiuni GitHub.
          find extracted -mindepth 1 -maxdepth 1 ! -name ".github" \
            -exec cp -R {} . \;

          # Daca ZIP-ul contine un folder .github, il ignoram intentionat.

          rm -rf extracted
          rm -f "ViralMovie-AI-V2-60MIN.zip"

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari."
          else
            git commit -m "Install ViralMovie AI V2"
            git push
          fi

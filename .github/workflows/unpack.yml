name: Install ViralMovie AI V2

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "EROARE: NU EXISTA NICIUN ZIP IN REPO!"
            exit 1
          fi

          echo "ZIP GASIT:"
          echo "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unzip
        run: |
          set -e

          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          echo "FISIERE EXTRASE:"
          find extracted -type f | sort

      - name: Install files
        run: |
          set -e

          cp -R extracted/. .

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari."
          else
            git commit -m "Install ViralMovie AI V2"
            git push
          fi
